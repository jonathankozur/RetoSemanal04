  Reglas de juego:
  Cada carta tiene un color asignado (Rojo, Verde, Violeta o Azul).
  Se reparten 3 cartas por jugador (Está planteado para poder repartir
  y mostrar mas cartas, pero por cuestiones de tiempo, todavia no esta
  resuelto el match. Cambiar variable "cartasPorJugador")
  Se evalua cada carta contra la carta del mismo indice del jugador contrario
  y en base a eso se determina un valor (-1, 0 o 1)
  Luego de evaluar las 3 cartas, se suman estos valores parciales
  Si la suma da positivo, hay MATCH. En caso contrario NO HAY MATCH
  -->
